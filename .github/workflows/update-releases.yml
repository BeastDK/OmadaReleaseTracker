name: Update Omada release calendar

on:
  schedule:
    # Runs every morning at 06:00 UTC. Adjust as needed.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch_releases.py
        id: fetch
        env:
          CALENDAR_ICS_URL: ${{ vars.CALENDAR_ICS_URL }}
        run: python fetch_releases.py

      - name: Commit and push changes
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json changelog.json docs/index.html
          git commit -m "Update release calendar ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

      # In case nothing changed but the generated files still need an
      # initial commit (e.g. first-ever run of the workflow)
      - name: Commit initial build (only if no changes but files are missing)
        if: steps.fetch.outputs.changed == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add data.json changelog.json docs/index.html
            git commit -m "Initial build"
            git push
          else
            echo "Nothing to commit."
          fi

      - name: Send email on changes
        if: steps.fetch.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Omada release calendar updated"
          to: ${{ secrets.MAIL_TO }}
          from: "Omada Release Tracker <${{ secrets.SMTP_USERNAME }}>"
          body: file://last_changes.txt

  deploy-pages:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo (after update)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
